name: Restore demographic input flow

on:
  push:
    branches:
      - fix/restore-demographic-input
    paths:
      - .github/workflows/restore-demographic-input.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-demographic-input
      - name: Apply rollback
        run: python scripts/restore-demographic-input.py
      - name: Commit rollback
        run: |
          git diff --check
          git config user.name "Kinetic Napier"
          git config user.email "u61819269@gmail.com"
          git rm .github/workflows/restore-demographic-input.yml scripts/restore-demographic-input.py
          git add app/reception-page.tsx tests/safety-regressions.test.mjs
          git commit -m "Restore demographic input flow"
          git push origin HEAD:fix/restore-demographic-input
